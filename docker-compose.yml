services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: RexialFrontend
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    depends_on:
      - backend
      - genai

  ws-server:
    build:
      context: .
      dockerfile: apps/ws-server/Dockerfile
    container_name: RexialWsServer
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    # Share the HTTP server's signing secret so organizer tokens verify here.
    env_file:
      - path: apps/http-server/.env
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/Qtrive
      - REDIS_HOST=redis    
      - REDIS_PORT=6379
      - REDIS_PASSWORD=thisistheredisPassword
    command: sh -c "pnpm --filter @repo/db run db:generate && pnpm run dev"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/http-server/Dockerfile
    container_name: RexialBackend
    ports:
      - "4000:4000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/Qtrive
    command: sh -c " pnpm --filter @repo/db run db:generate && npx wait-on
      tcp:db:5432 && pnpm --filter @repo/db run db:push && pnpm run dev "
    depends_on:
      db:
        condition: service_healthy

  genai:
    build:
      context: .
      dockerfile: apps/genAI/Dockerfile
    container_name: RexialGenAI
    ports:
      - "8000:8000"
    volumes:
      - ./apps/genAI/app:/app/apps/genAI/app
      - Qtrive_genai_uploads:/app/apps/genAI/uploads
      - Qtrive_genai_models:/models
    env_file:
      - apps/genAI/.env
    environment:
      - UPLOAD_DIR=/app/apps/genAI/uploads
      - ALLOWED_ORIGINS=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Live video quizzes. Off unless asked for:
  #   docker compose --profile streaming up
  # and set VITE_STREAMING_URL=http://localhost:7000 for the frontend.
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: RexialLiveKit
    profiles: ["streaming"]
    command: --config /etc/livekit.yaml
    volumes:
      - ./apps/streaming/livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"         # signaling
      - "7881:7881"         # media over TCP (fallback)
      - "7882:7882/udp"     # media over UDP

  streaming:
    build:
      context: .
      dockerfile: apps/streaming/Dockerfile
    container_name: RexialStreaming
    profiles: ["streaming"]
    ports:
      - "7000:7000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/Qtrive
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_PUBLIC_URL=ws://localhost:7880
    command: sh -c "pnpm --filter @repo/db run db:generate && pnpm run dev"
    depends_on:
      db:
        condition: service_healthy
      livekit:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: Rexial_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Qtrive
    volumes:
      - Qtrive_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d Qtrive" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: Rexial_redis
    ports:
      # Host port is overridable for machines that already run Redis on
      # 6379. Containers reach it as redis:6379 either way.
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --requirepass thisistheredisPassword --bind 0.0.0.0
    volumes:
      - Qtrive_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "thisistheredisPassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  Qtrive_data:
  Qtrive_redis_data:
  Qtrive_genai_uploads:
  Qtrive_genai_models:
